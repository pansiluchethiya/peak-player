version: '3.9'
services:
  peak:
    build: .
    container_name: peak
    environment:
      # Provide at least one TMDB key (comma separated or override via UI later)
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      # Alternative: supply JSON array
      # - TMDB_API_KEYS=["key1","key2"]
      - API_PORT=8787
      - BIND_HOST=0.0.0.0
      # FebBox cookies (comma separated) if you want Showbox immediately functional
      - FEBBOX_COOKIES=${FEBBOX_COOKIES:-}
    ports:
      - "8787:8787"
    volumes:
      # Persist runtime overrides (created by the admin UI)
      - user_config_data:/app/utils/user-config.json
      # Allow restart trigger file (optional; stored in container FS)
      # - restart_marker:/app/restart.trigger
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  player:
    build:
      context: ./player
      dockerfile: Dockerfile
    container_name: peak-player
    environment:
      - API_URL=http://peak:8787
      - PUBLIC_API_URL=http://localhost:8787
      - PORT=3001
    ports:
      - "${PLAYER_PORT:-3001}:3001"
    depends_on:
      peak:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  user_config_data:
  # restart_marker:
