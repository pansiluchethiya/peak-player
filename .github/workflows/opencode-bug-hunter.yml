name: OpenCode Autonomous Bug Hunter

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  hunt-bugs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --prefer-offline --no-audit

      - name: Run OpenCode Autonomous Agent
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/glm-5.3-flash-free
          agent: build
          prompt: |
            You are an expert autonomous bug hunter specializing in TypeScript, full-stack JavaScript frameworks, web applications, and containerized architectures.
            
            This project contains 3 distinct applications alongside a Docker setup for one-click deployment. Inspect the codebase for the current trigger event. Look specifically for:
            1. Server-side rendering anomalies, hydration discrepancies, data streaming faults, or unhandled exceptions.
            2. Network configuration issues within your docker-compose or inefficiencies in multi-stage Dockerfiles that compromise deployment reliability.
            3. Resource leaks, invalid API routes, cross-application contract mismatches, or missing environment configurations.

            If you identify any definitive bugs or deployment regressions, write the fix immediately inside the affected application or configuration file, create a new branch, push the changes, and open a Pull Request back into the target branch detailing your findings.
            
